name: Production Deployment

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "libs/**"
      - "pnpm-lock.yaml"
      - "nx.json"
      - ".github/workflows/backend-cd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ghcr.io/xayrulloh/family-tree-api:stable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build API
        run: npx nx build api --prod

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/xayrulloh/family-tree-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod

    steps:
      - name: Request Dokploy deployment
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?Set the DOKPLOY_URL environment variable}"
          : "${DOKPLOY_COMPOSE_ID:?Set the DOKPLOY_COMPOSE_ID environment variable}"
          : "${DOKPLOY_API_KEY:?Set the DOKPLOY_API_KEY environment secret}"
          payload=$(jq -nc --arg composeId "$DOKPLOY_COMPOSE_ID" '{composeId: $composeId}')
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload" --output /dev/null
          echo 'Deployment queued. Check Dokploy deployment logs for rollout status.' >> "$GITHUB_STEP_SUMMARY"
